name: NOVA Video Engine (Pabrik Gaib)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt untuk video'
        required: true
        default: 'A majestic flying cat, highly detailed'
      loops:
        description: 'Jumlah jahitan (Misal: 5 = 35 detik)'
        required: true
        default: '5'
      image_url:
        description: 'Link Gambar Awal (Harus URL dari internet)'
        required: true
        default: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba'

jobs:
  generate-video:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Bangunkan Robot & Buka Folder
        uses: actions/checkout@v4
        
      - name: Siapkan Mesin Python & FFmpeg
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Instal Kebutuhan (Bensin Mesin)
        run: |
          pip install gradio_client requests Pillow httpx opencv-python-headless
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Mulai Menjahit Video 30 Detik!
        run: python engine.py "${{ github.event.inputs.prompt }}" "${{ github.event.inputs.loops }}" "${{ github.event.inputs.image_url }}"
        
      - name: Simpan Video ke Repository (CDN & Fast Direct Stream)
        run: |
          if [ ! -f hasil_akhir.mp4 ]; then
            echo "Error: hasil_akhir.mp4 tidak ditemukan!"
            exit 1
          fi

          # Salin hasil akhir ke latest_video.mp4
          cp hasil_akhir.mp4 latest_video.mp4
          
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Hapus file temporer klip agar repo bersih
          rm -f clip_*.mp4 frame_*.jpg start.jpg list.txt hasil_akhir.mp4
          
          git add latest_video.mp4
          git commit -m "Update latest video [skip ci]" || echo "No changes to commit"
          
          # Gunakan commit hash unik agar jsDelivr tidak pernah menyajikan video lama yang tercache!
          COMMIT_HASH=$(git rev-parse HEAD)
          URL="https://cdn.jsdelivr.net/gh/CrostianXX/nova-video-engine@${COMMIT_HASH}/latest_video.mp4"
          echo "$URL" > latest_video.txt
          echo "Video URL siap: $URL"
          
          git add latest_video.txt
          git commit --amend --no-edit || true
          
          FINAL_HASH=$(git rev-parse HEAD)
          URL="https://cdn.jsdelivr.net/gh/CrostianXX/nova-video-engine@${FINAL_HASH}/latest_video.mp4"
          echo "$URL" > latest_video.txt
          
          git push origin HEAD:main --force
